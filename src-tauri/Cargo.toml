[package]
name = "guanaco"
version = "0.1.0"
description = "Gerenciador de IA local com interface de conversa integrada"
authors = ["Antonio Eduardo"]
edition = "2021"

[lib]
name = "guanaco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
